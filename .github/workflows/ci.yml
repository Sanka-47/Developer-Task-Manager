name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Validate main stack
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate bootstrap stack
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          target: runner
          push: false
          tags: taskapp-api:ci

      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          target: migrator
          push: false
          tags: taskapp-api-migrator:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          target: runner
          push: false
          tags: taskapp-web:ci
          build-args: |
            API_ORIGIN=http://api:4200
